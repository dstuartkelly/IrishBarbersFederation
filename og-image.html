<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OG Image Generator - Irish Barbering Federation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #10251d;
            color: #f2f0e8;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        h1 {
            margin: 0;
            font-size: 24px;
        }

        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        button {
            background: #d1f36a;
            color: #10251d;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
        }

        button:hover {
            opacity: 0.9;
        }

        #canvas {
            border: 2px solid #d1f36a;
            border-radius: 8px;
            max-width: 100%;
            height: auto;
        }

        .info {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>OG Image Generator - Irish Barbering Federation</h1>

    <div class="controls">
        <button onclick="generateImage()">Regenerate</button>
        <button onclick="downloadImage()">Download PNG</button>
    </div>

    <canvas id="canvas" width="1200" height="630"></canvas>

    <div class="info">
        <strong>Recommended Size:</strong> 1200×630px (Facebook, Twitter, LinkedIn, WhatsApp)<br>
        Save as: <code>og-image.png</code> and upload to your <code>/images/</code> folder
    </div>

    <script>
        // Colours match :root in styles/style.css
        const INK = '#10251d';
        const GREEN = '#183a2d';
        const CREAM = '#f2f0e8';
        const LIME = '#d1f36a';
        const MUTED = '#9ca99f';
        const DISPLAY = "'Manrope', -apple-system, BlinkMacSystemFont, sans-serif";

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const logoImg = new Image();

        logoImg.onload = logoImg.onerror = () => {
            // Wait for Manrope so the canvas doesn't fall back to a system font
            Promise.all([
                document.fonts.load('800 64px Manrope'),
                document.fonts.load('700 28px Manrope')
            ]).catch(() => {}).then(generateImage);
        };
        logoImg.src = 'images/TransparentScissors.png';

        function generateImage() {
            const w = canvas.width;
            const h = canvas.height;

            // Background: IBF dark green with a soft lighter glow
            ctx.fillStyle = INK;
            ctx.fillRect(0, 0, w, h);
            const glow = ctx.createRadialGradient(w / 2, 220, 40, w / 2, 220, 520);
            glow.addColorStop(0, GREEN);
            glow.addColorStop(1, INK);
            ctx.fillStyle = glow;
            ctx.fillRect(0, 0, w, h);

            // Logo, keeping its aspect ratio
            if (logoImg.complete && logoImg.naturalWidth > 0) {
                const logoH = 230;
                const logoW = logoH * logoImg.naturalWidth / logoImg.naturalHeight;
                ctx.drawImage(logoImg, (w - logoW) / 2, 36, logoW, logoH);
            }

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // Main title
            ctx.fillStyle = CREAM;
            ctx.font = '800 64px ' + DISPLAY;
            ctx.fillText('Irish Barbering', w / 2, 340);
            ctx.fillText('Federation', w / 2, 410);

            // Tagline
            ctx.fillStyle = LIME;
            ctx.font = '700 34px ' + DISPLAY;
            ctx.fillText('2,000 barbers. One voice.', w / 2, 495);

            // Campaign label
            ctx.fillStyle = MUTED;
            ctx.font = '700 18px ' + DISPLAY;
            if ('letterSpacing' in ctx) ctx.letterSpacing = '4px';
            ctx.fillText('IBF 2000 · NATIONAL MEMBERSHIP CAMPAIGN', w / 2, 570);
            if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
        }

        function downloadImage() {
            try {
                canvas.toBlob(blob => {
                    const link = document.createElement('a');
                    link.download = 'og-image.png';
                    link.href = URL.createObjectURL(blob);
                    document.body.appendChild(link);
                    link.click();
                    link.remove();
                    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
                }, 'image/png');
            } catch (err) {
                // Tainted canvas (e.g. opened via file://): export is blocked
                alert('Could not export the canvas: ' + err.message + '\nServe the page with "php -S localhost:8000" instead of opening the file directly.');
            }
        }
    </script>
</body>
</html>
