# Apache for the local copy of the site. PHP runs in the separate php-fpm container.

ServerRoot "/usr/local/apache2"
ServerName localhost
Listen 80
Listen 443

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule env_module modules/mod_env.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule headers_module modules/mod_headers.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule dir_module modules/mod_dir.so
LoadModule alias_module modules/mod_alias.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_fcgi_module modules/mod_proxy_fcgi.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule ssl_module modules/mod_ssl.so

User daemon
Group daemon

ServerTokens Prod
ServerSignature Off

# Deny everything outside the document root by default
<Directory />
    AllowOverride None
    Require all denied
</Directory>

DocumentRoot "/var/www/html"
<Directory "/var/www/html">
    # AllowOverride All so the site's .htaccess (redirects, 403s, security headers) is used as on the server
    Options FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

DirectoryIndex index.html index.php

<Files ".ht*">
    Require all denied
</Files>

# Hand .php files to PHP-FPM
<FilesMatch "\.php$">
    SetHandler "proxy:fcgi://php:9000"
</FilesMatch>
ProxyTimeout 60

TypesConfig conf/mime.types

ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
CustomLog /proc/self/fd/1 combined

SSLSessionCache "shmcb:/usr/local/apache2/logs/ssl_scache(512000)"

<VirtualHost *:80>
    # The site's .htaccess redirects HTTP to HTTPS
</VirtualHost>

<VirtualHost *:443>
    SSLEngine on
    SSLCertificateFile "/usr/local/apache2/conf/localhost.crt"
    SSLCertificateKeyFile "/usr/local/apache2/conf/localhost.key"
</VirtualHost>
